name: StockPilot Trade GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve optional Cloudflare R2 Worker address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OVERRIDE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: node .github/scripts/resolve-worker-url.mjs

      - name: Build Vite frontend
        env:
          VITE_NEON_AUTH_URL: https://ep-orange-bar-b4kev17j.neonauth.c-6.us-east-2.aws.neon.tech/neondb/auth
          VITE_NEON_DATA_API_URL: https://ep-orange-bar-b4kev17j.apirest.c-6.us-east-2.aws.neon.tech/neondb/rest/v1
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
